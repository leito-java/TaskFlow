spring:
  application:
    name: taskflow-api
  profiles:
    default: dev
  jpa:
    hibernate:
      # Hibernate contrôle le schéma, mais seul Flyway a le droit de le modifier.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

app:
  security:
    # À remplacer en production par une variable d'environnement longue et secrète.
    jwt-secret: ${JWT_SECRET:change-this-development-secret-before-production-please}
    jwt-expiration-minutes: 480
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:4201

springdoc:
  swagger-ui:
    path: /swagger-ui.html
