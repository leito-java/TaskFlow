name: CI full-stack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Tests et build Angular
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskflow_e2e
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/taskflow_e2e
      DB_USERNAME: taskflow
      DB_PASSWORD: taskflow_e2e
      JWT_SECRET: taskflow-e2e-secret-long-enough-for-automated-tests
      PLAYWRIGHT_BROWSERS_PATH: "0"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tester
        run: npm test

      - name: Construire
        run: npm run build

      - name: Installer Chromium
        run: |
          npx playwright install-deps chromium
          npm run test:e2e:install

      - name: Tester le parcours critique
        run: npm run test:e2e

      - name: Conserver le rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  backend:
    name: Tests et build Spring Boot
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskflow_test
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/taskflow_test
      POSTGRES_TEST_USERNAME: taskflow
      POSTGRES_TEST_PASSWORD: taskflow_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compiler et tester
        run: mvn --batch-mode --no-transfer-progress verify
